<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Daniel Staszak</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">

  <!-- Aplikacja na iPhonie: Safari → Udostępnij → Do ekranu początkowego -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel DS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <link rel="preload" href="../assets/fonts/oswald-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" defer></script>
</head>
<body class="panel-body">
  <div class="bg" aria-hidden="true">
    <div class="bg__glow"></div>
    <div class="bg__knurl"></div>
    <div class="bg__grain"></div>
  </div>

  <main class="panel" id="app" aria-live="polite">
    <p class="panel-loading">Ładowanie…</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Panel wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
